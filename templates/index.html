<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's Available</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="app">
        <header class="hero">
            <h1>Who's available?</h1>
            <p class="hero-sub"><strong id="count-available">0</strong> of <strong id="count-total">0</strong> teammates are available right now</p>
            <div class="meter" aria-hidden="true"><span id="meter-fill"></span></div>
        </header>

        <div class="toolbar">
            <input id="search" class="search" type="search" placeholder="Search people…" aria-label="Search people" autocomplete="off">
            <div class="filters" role="tablist" aria-label="Filter">
                <button class="filter is-active" data-filter="all" role="tab">All</button>
                <button class="filter" data-filter="available" role="tab">Available</button>
                <button class="filter" data-filter="away" role="tab">Away</button>
            </div>
        </div>

        <ul class="list" id="people-list">
            {% for person in people %}
            <li class="card {{ 'is-available' if person.available else '' }}" data-id="{{ person.id }}" data-name="{{ person.name|lower }}">
                <div class="avatar" aria-hidden="true">{{ person.name[:1]|upper }}</div>
                <div class="info">
                    <div class="name">{{ person.name }}</div>
                    <div class="status"><i class="dot"></i><span class="status-text">{{ 'Available' if person.available else 'Away' }}</span></div>
                </div>
                <button class="switch" role="switch" aria-checked="{{ 'true' if person.available else 'false' }}" aria-label="Toggle availability for {{ person.name }}"><span class="knob"></span></button>
            </li>
            {% endfor %}
        </ul>

        <p class="empty" id="empty" hidden>No one matches.</p>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
